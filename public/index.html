<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开车分账 · 谈判桌</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="shell">
<header class="top"><div class="brand"><div class="mark">车</div><div><div class="eyebrow">LOCAL NEGOTIATION GAME</div><h1>开车分账</h1></div></div><div class="roundbox"><span class="pulse"></span><span id="phase">准备就绪</span><b id="round">— / 3</b></div></header>
<section class="intro"><div><span class="eyebrow">谈判桌 · 本地单机</span><h2>说服他们，<em>然后开车。</em></h2><p>公开谈判、私下交易。时机一到，系统按协议规则分配整池资金。</p></div><label class="count-select">电脑玩家 <select id="botCount"><option value="2">2 人</option><option value="3" selected>3 人</option><option value="4">4 人</option><option value="5">5 人</option></select></label><button class="reset" id="reset">↻　新开一局</button></section>
<section class="board"><div class="table-head"><div><span class="eyebrow">本局资产</span><h3>公共车辆 <span class="car">▰</span></h3></div><div class="vehicle-value"><strong id="vehicle">120</strong><span>代币价值</span></div><div class="table-stats"><div><small>结算池预估</small><b id="pool">—</b></div><div><small>在场玩家</small><b id="playerCount">—</b></div></div></div>
<div class="players" id="players"></div></section>
<section class="workspace"><div class="panel chat-panel"><div class="panel-head"><div><span class="eyebrow">桌上广播 · 私人频道</span><h3>谈判频道</h3></div><button class="icon-btn" id="scrollChat" title="滚动到底部">↓</button></div><div class="chat-tabs" id="chatTabs"></div><div class="messages" id="messages"></div><form class="composer" id="chatForm"><input id="chatInput" maxlength="240" placeholder="说点什么，让谈判继续…" autocomplete="off"><button class="send" aria-label="发送">↑</button></form><div class="chat-note">Enter 发送　·　私聊只有你和收件人可见</div></div>
<div class="right-col"><div class="panel deal-panel"><div class="panel-head"><div><span class="eyebrow">安全托管 · 接受后立即生效</span><h3>交易提案</h3></div><span class="deal-icon">⇄</span></div><form id="dealForm" class="deal-form"><label>收款玩家<select id="dealTarget"></select></label><label>转账金额<input id="dealAmount" type="number" min="1" value="10"></label><label>附言（可选）<input id="dealNote" maxlength="70" placeholder="例如：开车后站我这边"></label><button class="primary" type="submit">提出交易 <span>→</span></button></form><div id="offers" class="offers"></div></div>
<div class="panel activity"><div class="panel-head"><div><span class="eyebrow">桌面记录</span><h3>交易日志</h3></div></div><div id="log" class="log"></div></div></div></section>
<footer class="footer"><span>本地策略 AI · 不需要 API-Key</span><div class="footer-actions"><button id="nextRound" class="next-round">结束本回合 <span>→</span></button><button id="drive" class="drive">开车结算 <span>↗</span></button></div></footer>
</main><div id="modal" class="modal hidden"></div><script src="/game.js"></script></body></html>
