<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>百万美金｜亡命之徒</title><link rel="stylesheet" href="/style.css"></head><body><main class="shell"><header class="top"><div class="brand"><div class="mark">$</div><div><div class="eyebrow">THE MILLION DOLLAR HEIST</div><h1>百万美金</h1></div></div><div class="roundbox"><span class="pulse"></span><span id="phase">准备中</span><b id="round">第 1 / 12 轮</b></div></header><section class="intro"><div><span class="eyebrow">谈判 · 心理博弈 · 风险决策</span><h2>座位有限，<em>活下来才能分钱。</em></h2><p id="subtitle">秘密选角，猜测对手；重复角色会撞车，独一无二者才能分赃。</p></div><div class="setup"><label>电脑玩家<select id="botCount"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option></select></label><button class="reset" id="newGame">新游戏</button></div></section><section class="board"><div class="table-head"><div><span class="eyebrow">本轮赃物</span><h3 id="cardTitle">等待开局</h3></div><div class="stats"><div><small>赃款</small><b id="loot">—</b></div><div><small>保证金</small><b id="bail">—</b></div><div><small>奖励角色</small><b id="bonus">—</b></div><div><small>胜利线</small><b id="target">—</b></div></div></div><div class="players" id="players"></div></section><section class="workspace"><div class="panel"><div class="panel-head"><div><span class="eyebrow">阶段行动</span><h3 id="actionTitle">建立游戏</h3></div></div><div id="action" class="action"></div><div id="reveal" class="reveal"></div><div id="threats" class="action"></div></div><div class="right-col"><div class="panel chat-panel"><div class="panel-head"><div><span class="eyebrow">公开谈判 / 私聊</span><h3>聊天</h3></div></div><div class="chat-tabs" id="chatTabs"></div><div class="messages" id="messages"></div><form class="composer" id="chatForm"><input id="chatInput" maxlength="240" placeholder="公开谈判或私聊…" autocomplete="off"><button class="send">发送</button></form></div><div class="panel deal-panel"><div class="panel-head"><div><span class="eyebrow">可执行协议</span><h3>一次性转账提案</h3></div></div><form id="dealForm" class="deal-form"><label>付款方<select id="payer"></select></label><label>收款方<select id="payee"></select></label><label>金额（万）<input id="amount" type="number" min="1" value="100"></label><button class="primary">发起提案</button></form><div id="offers" class="offers"></div><div class="chat-note">仅双方明确接受生效；退出换钱可在交易备注中说明，但不自动强制退出。未来承诺仅作聊天内容。</div></div></div></section><section class="panel log-panel"><div class="panel-head"><div><span class="eyebrow">已公开事件</span><h3>本局记录</h3></div></div><div id="log" class="log"></div></section><footer class="footer"><span>电脑角色采用本地策略 · 无需 API-Key</span><button id="mainButton" class="drive">开始新局</button></footer></main><div id="modal" class="modal hidden"></div><script src="/game.js"></script></body></html>
